<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ISM Tesla Importer</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 14px;
      color: #1e293b;
      background: #f8fafc;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .header h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 4px;
    }
    .server-status {
      font-size: 11px;
      color: #64748b;
      display: flex;
      align-items: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .card-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 4px;
    }
    .ro-select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 12px;
      background: #ffffff;
      color: #0f172a;
      box-sizing: border-box;
      margin-top: 4px;
    }
    .instructions {
      font-size: 12px;
      color: #475569;
      line-height: 1.4;
    }
    .instructions ol {
      margin: 6px 0 0 16px;
      padding: 0;
    }
    .btn {
      display: block;
      width: 100%;
      text-align: center;
      padding: 8px;
      background: #0284c7;
      color: #ffffff;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      box-sizing: border-box;
      margin-top: 10px;
    }
    .btn:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>⚡ ISM Tesla Importer</h1>
    <div class="server-status">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Connected</span>
    </div>
  </div>

  <div class="card">
    <div class="card-label">Active Repair Order</div>
    <select id="active-ro-select" class="ro-select">
      <option value="">Loading Repair Orders...</option>
    </select>
    <div id="active-ro-vehicle" style="font-size: 11px; color: #64748b; margin-top: 6px;"></div>
  </div>

  <div class="card instructions">
    <strong>How to use:</strong>
    <ol>
      <li>Open a Repair Order in ISM.</li>
      <li>Click <strong>Tesla Manual</strong> to launch procedures for your vehicle.</li>
      <li>On any manual page, click <strong>Import to Repair Order</strong> on the floating badge!</li>
    </ol>
  </div>

  <a href="#" id="open-ism-link" class="btn">Open ISM</a>

  <script src="popup.js"></script>
</body>
</html>
